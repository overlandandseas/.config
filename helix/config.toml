# l = [":sh kitty @ launch --type overlay --cwd current --env HX_SEND=${KITTY_WINDOW_ID} -- nnn -p -; kitten @ send-text --match id:3 'neat'"]
# k = [":pipe :o", ":sh kitten @ send-text --match id:3 --stdin"]
i = ":fmt" # Format current buffer

