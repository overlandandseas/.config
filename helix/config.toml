theme ="tokyonight"

[editor]
line-number = "relative"
shell = ["zsh", "-c"]
true-color = true
auto-format = false
auto-save = false
end-of-line-diagnostics = "hint"

[editor.cursor-shape]
insert = "bar"
normal = "block"

[editor.file-picker]
hidden = false

[editor.soft-wrap]
enable = true

[editor.statusline]
right = ["version-control", "diagnostics", "selections", "position", "file-encoding"]



[keys.normal.space]
